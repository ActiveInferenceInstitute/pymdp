name: Lint

on:
  pull_request:
    paths:
      - '**.py'
      - '.github/workflows/lint.yaml'
      - 'pyproject.toml'
      - 'gate.sh'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.14"
    - name: Install uv
      uses: astral-sh/setup-uv@v6
    # One command definition: the gate pins ruff through the `dev` dependency
    # group (>=0.15,<0.16), so CI and the pre-commit hook cannot drift.
    - name: Lint
      run: ./gate.sh lint
