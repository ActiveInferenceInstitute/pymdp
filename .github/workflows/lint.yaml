name: Lint

on:
  pull_request:
    paths:
      - '**.py'
      - '.github/workflows/lint.yaml'
      - 'pyproject.toml'
      - 'gate.sh'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    timeout-minutes: 60
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: "3.14"
    - name: Install uv
      uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
    # One command definition: the gate pins ruff through the `dev` dependency
    # group (>=0.15,<0.16), so CI and the pre-commit hook cannot drift.
    - name: Lint
      run: ./gate.sh lint
