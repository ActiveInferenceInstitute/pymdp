name: release-please

on:
  push:
    branches: [main]

# Default to least-privilege; jobs that need more elevate per-job.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    timeout-minutes: 120
    runs-on: ubuntu-24.04
    permissions:
      contents: write       # commit version bumps, create release tag
      pull-requests: write  # open/update the Release PR
      issues: write         # apply autorelease:* labels
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        id: release
        with:
          # Use a PAT instead of GITHUB_TOKEN so commits and PRs created
          # by release-please are authored by a real user account, which
          # lets the merge of release-please's own PR trigger this
          # workflow's push event (GITHUB_TOKEN-authored events are
          # suppressed by GitHub's recursion guard).
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build:
    timeout-minutes: 120
    name: Build distribution
    needs: release-please
    if: ${{ needs.release-please.outputs.releases_created == 'true' }}
    runs-on: ubuntu-24.04
    # Inherits workflow default (contents: read), sufficient for checkout.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --sdist --wheel

      - name: Smoke-test built wheel
        run: |
          python -m pip install dist/*.whl
          cd /tmp
          python - <<'PY'
          import pymdp
          from pymdp.agent import Agent

          print("Imported pymdp from", pymdp.__file__)
          assert "site-packages" in pymdp.__file__
          print("Agent symbol:", Agent.__name__)
          PY

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist/

  publish:
    timeout-minutes: 120
    name: Publish to PyPI
    needs: [release-please, build]
    if: ${{ needs.release-please.outputs.releases_created == 'true' }}
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/p/inferactively-pymdp
    permissions:
      id-token: write  # OIDC for PyPI trusted publishing (replaces defaults)
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
