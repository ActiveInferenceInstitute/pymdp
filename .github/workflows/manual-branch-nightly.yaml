name: Manual Branch Nightly

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or SHA to validate
        required: true
        # FORK-LOCAL: this fork's default branch is `master`, not upstream's `main`.
        default: master
        type: string
      python_version:
        description: Python version to use
        required: true
        default: "3.14"
        type: string

concurrency:
  group: manual-branch-nightly-${{ inputs.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  nightly:
    timeout-minutes: 120
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      # Work around a jaxlib 0.10.2+ XLA:CPU bug (__ynn_fusion crash/hang on rank>=7
      # broadcast-multiply-reduce). See https://github.com/jax-ml/jax/issues/39257.
      # Remove once fixed upstream.
      XLA_FLAGS: --xla_cpu_experimental_ynn_fusion_type=
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Python ${{ inputs.python_version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ inputs.python_version }}

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0

      - name: Verify nightly validation files exist
        run: |
          test -f scripts/run_notebook_manifest.py
          test -f test/notebooks/nightly_notebooks.txt

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg graphviz libgraphviz-dev pkg-config build-essential python3-dev

      - name: Run nightly-marked tests
        run: ./gate.sh test-nightly

      - name: Run nightly-tier notebook tests
        run: ./gate.sh notebooks-nightly
