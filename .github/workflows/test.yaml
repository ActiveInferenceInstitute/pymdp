name: Test

on:
  push:
    # FORK-LOCAL: this fork's default branch is `master`; upstream uses `main`.
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    timeout-minutes: 120
    runs-on: ubuntu-latest
    env:
      # Work around a jaxlib 0.10.2+ XLA:CPU bug: the default-on __ynn_fusion path
      # crashes/hangs on rank>=7 broadcast-multiply-reduce kernels on x86-64, which
      # stalls the padded-A jit cells in the infer_states notebooks for >2000s.
      # See https://github.com/jax-ml/jax/issues/39257. Remove once fixed upstream.
      XLA_FLAGS: --xla_cpu_experimental_ynn_fusion_type=
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        uses: astral-sh/setup-uv@v6
      - name: Check out the pinned GNN tree
        run: |
          set -euo pipefail
          PIN=.github/gnn-pin.json
          REPO=$(python -c "import json;print(json.load(open('$PIN'))['repository'])")
          TAG=$(python -c "import json;print(json.load(open('$PIN'))['tag'])")
          REVISION=$(python -c "import json;print(json.load(open('$PIN'))['revision'])")
          # The checkout follows .github/gnn-pin.json, so a pin bump re-points
          # it; the GNN source tree stays external to the package.
          git clone --depth 1 --branch "$TAG" "https://github.com/$REPO" ../Generalized_Notation_Notation
          test "$(git -C ../Generalized_Notation_Notation rev-parse HEAD)" = "$REVISION"
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg graphviz libgraphviz-dev pkg-config build-essential python3-dev
      - name: Install dependencies
        run: |
          uv sync --group test --extra gnn
      - name: Running unit tests with coverage
        env:
          # The GNN bridge tests run against the pinned tree, so they must fail
          # rather than skip if it is missing (see AGENTS.md, "never convert a
          # skip into a pass").
          PYMDP_GNN_ROOT: ${{ github.workspace }}/../Generalized_Notation_Notation/src
          PYMDP_GNN_CHECKOUT: ${{ github.workspace }}/../Generalized_Notation_Notation
          PYMDP_GNN_REQUIRED: "1"
        run: |
          uv run pytest test -n 2 -m "not nightly" --cov=pymdp --cov-report=xml --cov-report=html --cov-report=term
      - name: Upload coverage reports as artifact
        uses: actions/upload-artifact@v4
        with:
          name: pymdp-coverage-${{ matrix.python-version }}
          path: |
            coverage.xml
            htmlcov/
          retention-days: 30
      - name: Running CI-tier notebook tests
        run: |
          uv run python scripts/run_notebook_manifest.py test/notebooks/ci_notebooks.txt
