name: Python package

on:
  push:
    # FORK-LOCAL: this fork's default branch is `master`; upstream uses `main`.
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  package:
    # One build: the artifacts are pure Python, so a second interpreter would
    # repeat the same build and the same import check.
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install uv
        uses: astral-sh/setup-uv@v6
      # Builds the sdist and wheel, installs the wheel into a throwaway
      # environment and imports pymdp from outside the source tree.
      - name: Package gate
        run: ./gate.sh package
