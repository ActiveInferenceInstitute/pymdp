name: Python package

on:
  push:
    # FORK-LOCAL: this fork's default branch is `master`; upstream uses `main`.
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  package:
    # One build: the artifacts are pure Python, so a second interpreter would
    # repeat the same build and the same import check.
    timeout-minutes: 60
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"
      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      # Builds the sdist and wheel, installs the wheel into a throwaway
      # environment and imports pymdp from outside the source tree.
      - name: Package gate
        run: ./gate.sh package
