name: Docs

on:
  push:
    # FORK-LOCAL: this fork's default branch is `master`; upstream uses `main`.
    branches:
      - main
      - master
    paths:
      - 'examples/**'
      - 'mkdocs.yml'
      - 'docs-mkdocs/**'
      - 'scripts/docs_*.sh'
      - 'scripts/sync_docs_notebooks.sh'
      - '.readthedocs.yml'
      - 'pyproject.toml'
      - 'pymdp/**'
      - 'gate.sh'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'examples/**'
      - 'mkdocs.yml'
      - 'docs-mkdocs/**'
      - 'scripts/docs_*.sh'
      - 'scripts/sync_docs_notebooks.sh'
      - '.readthedocs.yml'
      - 'pyproject.toml'
      - 'pymdp/**'
      - 'gate.sh'
      - '.github/workflows/docs.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-docs:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install uv
        uses: astral-sh/setup-uv@v6
      # The gate's docs arm syncs the curated notebooks and then builds with
      # --no-sync, so the environment it builds in is this one, exactly.
      - name: Install docs environment
        run: uv sync --no-default-groups --extra docs
      - name: Docs gate (strict build)
        run: ./gate.sh docs
