  updated: '2026-11-10'
repo:
  name: pymdp
  slug: pymdp
  full_name: ActiveInferenceInstitute/pymdp
  description: 'A Python implementation of active inference for Markov Decision Processes:
    build generative models, infer states and policies by free-energy minimization,
    and simulate agents in discrete environments.'
  default_branch: master
institute:
  category: research-software
  maturity: released
  steward: Active Inference Institute
ecosystem:
  relations:
  - repo: ActiveInferenceInstitute/InstituteOS
    relation: referenced-by
    note: Federated via the InstituteOS .aii manifest.
  - repo: ActiveInferenceInstitute/Active_Inference_Ontology
    note: Uses Active Inference Ontology terms.
  - repo: ActiveInferenceInstitute/pymcp
    relation: feeds
    note: Exposes PyMDP over the Model Context Protocol and REST.
  - repo: ActiveInferenceInstitute/active_inference_language_model
    relation: feeds
    note: Conformance target for the AILM discrete language stack.
  - repo: ActiveInferenceInstitute/active_inference_power
    relation: feeds
    note: Agent engine for the statistical-power simulations.
  - repo: ActiveInferenceInstitute/policy_entanglement
    relation: feeds
    note: POMDP engine for the policy-entanglement experiments.
  - repo: ActiveInferenceInstitute/on_policy_distillation
    relation: feeds
    note: POMDP classroom engine for the distillation experiments.
  - repo: ActiveInferenceInstitute/active_fractal_rabbit
    relation: feeds
    note: Agent engine for the FractalRabbit scaffold.
  - repo: ActiveInferenceInstitute/Biofirm
    relation: feeds
    note: Agent engine for ecological control experiments.
  - repo: ActiveInferenceInstitute/Generalized_Notation_Notation
    note: Uses Generalized Notation Notation (GNN) for model specifications.
  links:
    github: https://github.com/ActiveInferenceInstitute/pymdp
    website: https://www.activeinference.org
